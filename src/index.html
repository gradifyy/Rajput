<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="robots" content="noindex,nofollow,noarchive" />
    <meta
      name="description"
      content="라즈뿟 인도요리 · 부산 덕천. Rajput Indian Cuisine restaurant and digital menu design preview."
    />
    <meta name="rajput-base" content="{{BASE}}" />
    <meta name="theme-color" content="#f8f3e9" />
    <title>Rajput · 라즈뿟 인도요리, 부산 덕천</title>
    <link rel="icon" href="{{BASE}}assets/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Serif+Display:ital@0;1&family=Noto+Sans+KR:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="{{BASE}}style.css" />
    <script src="{{BASE}}vendor/qrcode.js" defer></script>
    <script type="module" src="{{BASE}}app.js"></script>
  </head>
  <body>
    <a class="skip" href="#main">본문 바로가기 · Skip to content</a>
    <header class="site-header">
      <a class="brand" href="{{BASE}}" aria-label="Rajput home"
        >Rajput<span>라즈뿟 인도요리</span></a
      >
      <nav id="navigation" aria-label="Main navigation">
        <a href="{{BASE}}menu/" data-i="menu">메뉴</a
        ><a href="{{BASE}}#table" data-i="table">함께하는 식탁</a
        ><a href="{{BASE}}#visit" data-i="visit">오시는 길</a
        ><a href="{{BASE}}qr/" data-i="qrLink">QR 메뉴</a>
      </nav>
      <div class="header-actions">
        <button id="language" aria-label="Switch language to English">EN</button
        ><a class="button small" href="{{BASE}}menu/" data-i="viewMenu"
          >메뉴 보기 ↗</a
        ><button
          id="mobileToggle"
          class="mobile-toggle"
          aria-controls="navigation"
          aria-expanded="false"
          aria-label="메뉴 열기"
        >
          <span></span><span></span>
        </button>
      </div>
    </header>
    <main id="main" tabindex="-1"></main>
    <noscript
      ><p>
        라즈뿟 인도요리 · 부산광역시 북구 덕천1길 9, 2층. This preview needs
        JavaScript for its digital menu.
        <a href="https://map.naver.com/p/search/라즈뿟%20덕천">Naver Maps</a>
      </p></noscript
    >
    <footer class="site-footer">
      <div class="footer-identity">
        <a href="{{BASE}}" class="footer-brand">Rajput</a>
        <p>라즈뿟 인도요리<br />Deokcheon, Busan</p>
      </div>
      <div class="footer-links">
        <a href="{{BASE}}menu/" data-i="viewMenu">메뉴 보기 ↗</a
        ><a href="{{BASE}}#visit" data-i="visit">오시는 길</a
        ><a href="{{BASE}}qr/" data-i="qrLink">QR 메뉴</a>
      </div>
      <div class="footer-note">
        <span data-i="previewNote"
          >비공식 디자인 시안 · 이미지는 연출된 콘셉트 사진입니다.</span
        ><button id="previewInfo" data-i="previewInfo">시안 안내</button>
      </div>
    </footer>
    <dialog id="detail" aria-labelledby="dialogTitle">
      <button class="close" aria-label="닫기 · Close">×</button>
      <div id="dialogContent"></div>
    </dialog>
    <div id="toast" role="status" aria-live="polite"></div>
  </body>
</html>
